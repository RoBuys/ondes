[package]
name = "ondes"
version = "0.2.0"
description = "Ondes — lecteur IPTV pour Windows"
edition = "2021"

[lib]
name = "ondes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSObject", "NSString", "NSValue", "NSGeometry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
